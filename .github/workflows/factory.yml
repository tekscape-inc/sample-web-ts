name: factory
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  gates:
    if: startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch the factory CLI (public code-only mirror, pinned)
        run: |
          git clone -q https://github.com/tekscape-inc/factory-cli.git "$RUNNER_TEMP/factory-cli"
          git -C "$RUNNER_TEMP/factory-cli" checkout -q "e0f2d7812866661fe8b3e4b9269cb10066c7b438"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: install factory CLI and gitleaks
        run: |
          python -m pip install --quiet -e "$RUNNER_TEMP/factory-cli"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks
      - name: factory gate --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CARD="${HEAD_REF#factory/}"
          C0="$(git rev-list --reverse "$BASE..HEAD" | head -1)"
          factory gate --ci --card "$CARD" --c0 "$C0" --json
